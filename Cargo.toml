[package]
name = "openai-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web 框架
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Rate limiting
governor = "0.6"

# HTTP 客户端
reqwest = { version = "0.11", features = ["json", "stream"] }

# Regex
regex-lite = "0.1"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 配置
config = "0.14"
serde_yaml = "0.9"

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 异步 trait
async-trait = "0.1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 异步流
futures = "0.3"

# HTTP Body 类型
bytes = "1"

# 唯一 ID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Base64 encoding
base64 = "0.21"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
tempfile = "3.8"
http-body-util = "0.1"

# Encryption
aes-gcm = "0.10"
rand = "0.8"
