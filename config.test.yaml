server:
  host: "0.0.0.0"
  port: 8080
  body_limit: 10485760 # 10MB

providers:
  openai:
    api_key: "9bc4908eeaec48109dc363c638c45457.qCuUoeMnsZme5eum"
    base_url: "https://api.openai.com/v1"
    default_model: "gpt-4o"
    timeout: 120

  zhipu:
    api_key: ""
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    default_model: "glm-4"
    timeout: 60

routing:
  default: "openai"
  model_mapping:
    gpt-4*: "openai"
    gpt-3.5*: "openai"
    glm*: "zhipu"

logging:
  level: "info"
  format: "json"
  file_path: "logs/server.log"
