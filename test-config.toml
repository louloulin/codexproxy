# Test Configuration for GLM-5 Integration

[server]
host = "127.0.0.1"
port = 9080
body_limit = 10485760

[server.rate_limit]
requests_per_minute = 60
burst = 10

[providers.openai]
api_key = "mock-openai-key"
base_url = "https://api.openai.com/v1"
default_model = "gpt-4o"
timeout = 60

[providers.zhipu]
api_key = "mock-zhipu-key"
base_url = "https://open.bigmodel.cn/api/paas/v4"
default_model = "glm-4-flash"
timeout = 60

[routing]
default = "zhipu"
model_mapping = { "glm-*" = "zhipu", "gpt-*" = "openai" }

[logging]
level = "info"
format = "json"
file_path = "logs/server.log"
